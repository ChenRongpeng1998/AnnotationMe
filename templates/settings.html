<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像标注系统 - 设置</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-settings bootstrap-page-bg">
    <div class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">
                <div class="card shadow-sm border-0 settings-card">
                    <div class="card-body p-4 p-md-5">
                        <div class="mb-4">
                            <h1 class="h2 mb-2">图像标注系统</h1>
                            <p class="text-secondary mb-0">项目骨架版 · 设置页</p>
                        </div>

                        <form id="settings-form" class="settings-form">
                            <div class="card mb-4 section-card">
                                <div class="card-header bg-white">
                                    <h2 class="h5 mb-0">基础配置</h2>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label for="image_dir" class="form-label">图像文件夹路径</label>
                                        <input type="text" class="form-control" id="image_dir" name="image_dir" placeholder="请输入图像文件夹路径">
                                    </div>

                                    <div class="mb-3">
                                        <label for="output_dir" class="form-label">输出路径</label>
                                        <input type="text" class="form-control" id="output_dir" name="output_dir" placeholder="请输入输出目录路径">
                                    </div>

                                    <div class="row g-3">
                                        <div class="col-12 col-md-4">
                                            <label for="image_id_start" class="form-label">image_id 起始编号</label>
                                            <input type="number" class="form-control" id="image_id_start" name="image_id_start" min="0">
                                        </div>

                                        <div class="col-12 col-md-4">
                                            <label for="annotation_id_start" class="form-label">annotation_id 起始编号</label>
                                            <input type="number" class="form-control" id="annotation_id_start" name="annotation_id_start" min="0">
                                        </div>

                                        <div class="col-12 col-md-4">
                                            <label for="bbox_line_width" class="form-label">bbox 默认线宽</label>
                                            <input type="number" class="form-control" id="bbox_line_width" name="bbox_line_width" min="1">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card mb-4 section-card">
                                <div class="card-header bg-white">
                                    <h2 class="h5 mb-0">categories 配置</h2>
                                </div>
                                <div class="card-body">
                                    <label for="categories_json" class="form-label">JSON 文本</label>
                                    <textarea
                                        id="categories_json"
                                        name="categories_json"
                                        class="form-control form-control-json"
                                        rows="12"
                                        spellcheck="false"
                                        placeholder='[
  {"id": 1, "name": "button"},
  {"id": 2, "name": "knob"}
]'></textarea>
                                </div>
                            </div>

                            <div class="card mb-4 section-card">
                                <div class="card-header bg-white">
                                    <h2 class="h5 mb-0">自动标注 API 配置</h2>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label for="auto_annotate_api_url" class="form-label">API URL</label>
                                        <input type="text" class="form-control" id="auto_annotate_api_url" name="auto_annotate_api_url" placeholder="请输入外部 Flask 推理 API 地址">
                                    </div>

                                    <div class="mb-3">
                                        <label for="auto_annotate_token" class="form-label">Token</label>
                                        <input type="text" class="form-control" id="auto_annotate_token" name="auto_annotate_token" placeholder="请输入 token">
                                    </div>

                                    <div class="mb-0">
                                        <label for="auto_annotate_request_type" class="form-label">请求类型</label>
                                        <select id="auto_annotate_request_type" name="auto_annotate_request_type" class="form-select">
                                            <option value="path">path</option>
                                            <option value="image">image</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="card mb-4 section-card">
                                <div class="card-header bg-white">
                                    <h2 class="h5 mb-0">常用工具栏显示工具</h2>
                                </div>
                                <div class="card-body">
                                    <div class="row g-3" id="toolbar-options">
                                        <div class="col-6 col-md-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="select" id="tool-select">
                                                <label class="form-check-label" for="tool-select">选择</label>
                                            </div>
                                        </div>

                                        <div class="col-6 col-md-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="bbox" id="tool-bbox">
                                                <label class="form-check-label" for="tool-bbox">BBox</label>
                                            </div>
                                        </div>

                                        <div class="col-6 col-md-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="delete" id="tool-delete">
                                                <label class="form-check-label" for="tool-delete">删除</label>
                                            </div>
                                        </div>

                                        <div class="col-6 col-md-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="zoom_in" id="tool-zoom-in">
                                                <label class="form-check-label" for="tool-zoom-in">放大</label>
                                            </div>
                                        </div>

                                        <div class="col-6 col-md-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="zoom_out" id="tool-zoom-out">
                                                <label class="form-check-label" for="tool-zoom-out">缩小</label>
                                            </div>
                                        </div>

                                        <div class="col-6 col-md-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="fit" id="tool-fit">
                                                <label class="form-check-label" for="tool-fit">适配</label>
                                            </div>
                                        </div>

                                        <div class="col-6 col-md-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="prev" id="tool-prev">
                                                <label class="form-check-label" for="tool-prev">上一张</label>
                                            </div>
                                        </div>

                                        <div class="col-6 col-md-3">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" value="next" id="tool-next">
                                                <label class="form-check-label" for="tool-next">下一张</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex flex-wrap gap-2">
                                <button type="button" id="save-btn" class="btn btn-primary">保存配置</button>
                                <button type="button" id="save-and-start-btn" class="btn btn-success">保存并进入图片总览</button>
                            </div>

                            <div id="settings-message" class="mt-3 small"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
</body>
</html>
